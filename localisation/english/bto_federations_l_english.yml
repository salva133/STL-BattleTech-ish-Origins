l_english:
  origin_clan_confederation: "Clan Confederation"
  origin_clan_confederation_desc: "Your people are forged in the fires of ritual combat. Bound by the Clans' code of honour and tempered by generations of selective breeding, you stand at the head of a confederation of warrior cultures united under one banner."
  origin_tooltip_clan_confederation: "A Confederation of Warrior Cultures."

  trait_bto_clan_trueborn: "Trueborn"
  trait_bto_clan_trueborn_desc: "This species was bred through a rigorous eugenics programme. Generations of selective breeding have honed them into superior warriors."

  origin_stellar_union: "Stellar Union"
  origin_stellar_union_desc: "Your empire is the cornerstone of an ancient compact between the stars. Founded on the principles of order and martial supremacy, you lead a union of loyal star nations bound by shared heritage and imperial will."
  origin_tooltip_stellar_union: "Stellar Union"
